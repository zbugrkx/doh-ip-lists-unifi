name: update-doh-lists
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 clean.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doh-ipv4.txt doh-ipv6.txt
          git diff --cached --quiet || { git commit -m "Update DoH lists $(date -u +%F)"; git push; }
